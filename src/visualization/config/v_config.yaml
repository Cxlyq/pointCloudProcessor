/**:
  ros__parameters:
    subscribe_topic: "/reconstruction/white_mesh"
    fps_logging_enabled: true
    fps_logging_interval_sec: 5.0
    # 原始可视化不启用插帧，也不在新网格到达时强制恢复相机。
    interpolation_enabled: false
    interpolation_flow_consistency_mask: false
    interpolation_timing_source: "arrival"
    interpolation_max_playback_lag_ms: 1000
    interpolation_lock_camera: false
    # 定义需要开启的窗口 ID 列表
    camera_ids: ["cam_front"]
#    camera_ids: ["cam_front", "cam_top"]

    # --- 1号机位：正面视角 ---
    cam_front:
      name: "Real-time Render - Front View"
      width: 800
      height: 600
      background_color: [0.1, 0.1, 0.1]
      point_size: 2.0
      front: [-0.0, -1.0, 0.35]
      lookat: [-17.5, 2213.0, -86.0]
      up: [-0.0, 0.35, 1.0]
      zoom: 0.7

