visualization_node:
  ros__parameters:
    subscribe_topic: "/reconstruction/white_mesh"
    camera_ids: ["cam_front"]
    fps_logging_enabled: true
    fps_logging_interval_sec: 5.0

    # 第一阶段：只在可视化阶段进行单向、低分辨率 DIS 插帧。
    interpolation_enabled: true
    # 每两个真实帧之间插入4张虚拟帧，长期帧数约为原始的5倍。
    interpolation_intermediate_frames: 4
    interpolation_flow_scale: 0.25
    interpolation_dis_preset: "ultrafast"
    interpolation_bidirectional_flow: false
    interpolation_timing_source: "arrival"
    interpolation_lock_camera: true
    # Open3D is retained as a hidden renderer. Set true only when debugging
    # source-frame capture; normal interpolation mode shows one window.
    interpolation_show_source_window: false
    interpolation_window_suffix: " - DIS x5"

    cam_front:
      name: "Real-time Render - Front View"
      width: 800
      height: 600
      background_color: [0.1, 0.1, 0.1]
      point_size: 2.0
      front: [-0.0, -1.0, 0.35]
      lookat: [-17.5, 2213.0, -86.0]
      up: [-0.0, 0.35, 1.0]
      zoom: 0.7
