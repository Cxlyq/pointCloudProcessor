/**:
  ros__parameters:
    subscribe_topic: "/reconstruction/white_mesh"
    camera_ids: ["cam_front"]
    fps_logging_enabled: true
    fps_logging_interval_sec: 5.0

    interpolation_enabled: true
    interpolation_intermediate_frames: 4
    interpolation_flow_scale: 0.25
    interpolation_dis_preset: "ultrafast"
    interpolation_bidirectional_flow: true
    # Existing bidirectional quality setting; this patch does not change it.
    interpolation_flow_consistency_mask: true
    # visualization_node stamps every published source frame, so playback
    # cadence remains correct even when DDS or application backpressure grows.
    interpolation_timing_source: "message_stamp"
    # Bounded, strictly ordered local queues. When they fill, source reception
    # blocks and latency grows; no source pair or generated frame is dropped.
    interpolation_pending_pair_capacity: 3
    interpolation_ready_sequence_capacity: 2
    # Keep every HighGUI call on the display main thread and measure it.
    interpolation_highgui_event_mode: "poll_key"
    interpolation_lock_camera: true
    interpolation_show_source_window: false
    interpolation_window_suffix: " - Bidirectional DIS x5"

    cam_front:
      name: "Real-time Render - Front View"
      width: 800
      height: 600
      background_color: [0.1, 0.1, 0.1]
      point_size: 2.0
      front: [-0.0, -1.0, 0.35]
      lookat: [-17.5, 2213.0, -86.0]
      up: [-0.0, 0.35, 1.0]
      zoom: 0.7
